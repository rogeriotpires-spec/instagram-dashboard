name: Gerar edição de notícias

on:
  workflow_dispatch:
    inputs:
      agendado:
        description: "Deixe em nao no botão Run workflow (roda a qualquer hora). O agendador manda sim e só gera a edição das 06h."
        required: false
        default: "nao"
  push:
    branches: [main]
    paths:
      - ".github/run-noticias"

permissions:
  contents: write
  models: read

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.ok.outputs.seguir }}
    steps:
      - id: ok
        env:
          AGENDADO: ${{ github.event.inputs.agendado }}
        run: |
          if [ "$AGENDADO" != "sim" ]; then
            echo "seguir=sim" >> "$GITHUB_OUTPUT"
            echo "Disparo manual: a edição roda em qualquer hora."
            exit 0
          fi
          H=$(TZ=America/Sao_Paulo date +%H)
          if [ "$H" -ge 5 ] && [ "$H" -le 7 ]; then
            echo "seguir=sim" >> "$GITHUB_OUTPUT"
            echo "Agendador dentro da janela das 06h (${H}h BRT)."
          else
            echo "seguir=nao" >> "$GITHUB_OUTPUT"
            echo "Agendador fora da janela das 06h (${H}h BRT). Para gerar outra edição, use o botão sem agendado=sim."
          fi

  gerar:
    needs: horario
    if: needs.horario.outputs.seguir == 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      models: read
    env:
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Testes rápidos da edição
        run: |
          python3 tools/noticias_notas.py --self-test
          python3 tools/modelos_ia.py --self-test
          python3 tools/coleta_noticias.py --self-test
          python3 tools/editar_com_ia.py --self-test
          python3 tools/noticias_reparar.py --self-test
          python3 tools/qa_edicao.py --self-test

      - name: Coletar assuntos em alta
        run: python3 tools/coleta_trends.py || true

      - name: Instalar leitor reserva de feed
        continue-on-error: true
        run: pip install --quiet "scrapling[fetchers]"

      - name: Coletar notícias
        run: python3 tools/coleta_noticias.py 12 > coleta-noticias.json

      - name: Salvar coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-noticias-${{ github.run_id }}
          path: |
            coleta-noticias.json
            coleta-diagnostico.json
            noticias/trends.json
          if-no-files-found: warn
          retention-days: 7

      - name: Gerar edição com IA
        id: ia
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
        run: python3 tools/editar_com_ia.py coleta-noticias.json

      - name: Gerar edição por regras
        id: regras
        if: steps.ia.outcome == 'failure'
        run: python3 tools/gerar_edicao.py coleta-noticias.json

      - name: Conferir a edição
        id: qa
        if: steps.ia.outcome == 'success' || steps.regras.outcome == 'success'
        run: |
          ED=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=-3)))
          h = '06h' if now.hour < 9 else '12h' if now.hour < 16 else '19h'
          print(f'noticias/{now:%Y-%m-%d}-{h}.json')
          ")
          python3 tools/qa_edicao.py "$ED" coleta-noticias.json

      - name: Salvar edição gerada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edicao-gerada-${{ github.run_id }}
          path: |
            noticias/20*.json
            coleta-diagnostico.json
          if-no-files-found: warn
          retention-days: 7

      - name: Manter a edição vigente se o QA reprovar
        if: always() && steps.qa.outcome == 'failure'
        run: |
          git checkout -- noticias/ || true
          echo "QA reprovou: nada foi publicado; a edição anterior permanece no ar."

      - name: Publicar edição
        if: (steps.ia.outcome == 'success' || steps.regras.outcome == 'success') && steps.qa.outcome == 'success'
        run: |
          ED=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=-3)))
          h = '06h' if now.hour < 9 else '12h' if now.hour < 16 else '19h'
          print(f'noticias/{now:%Y-%m-%d}-{h}.json')
          ")
          if ! python3 - << PY
          import json, subprocess, sys
          from collections import Counter
          ed = "$ED"
          novos = json.load(open(ed, encoding="utf-8")).get("items") or []
          if len(novos) < 12:
              print(f"não publico: {len(novos)} matérias, abaixo de 12")
              sys.exit(1)
          try:
              antigo = json.loads(subprocess.check_output(["git", "show", f"HEAD:{ed}"], text=True))
          except subprocess.CalledProcessError:
              antigo = None
          if antigo:
              antigos = antigo.get("items") or []
              # Não bloqueia só porque o reparo tirou link trocado e enxugou a edição.
              if len(novos) < 12:
                  print(f"não publico: {len(novos)} matérias contra {len(antigos)}")
                  sys.exit(1)
          print(f"publico: {len(novos)} matérias")
          PY
          then
            echo "a edição anterior permanece"
            git checkout -- noticias/ || true
            exit 1
          fi
          MSG=$(python3 -c "
          import json,sys
          g=json.load(open(sys.argv[1],encoding='utf-8')).get('gerador')
          print('Notícias: edição com IA' if g=='ia' else 'Notícias: edição automática por regras')
          " "$ED")
          git add noticias/index.json noticias/20*.json
          if ! git diff --cached --quiet; then
            git commit -m "$MSG"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
