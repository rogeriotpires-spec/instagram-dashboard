
name: Gerar edição de notícias

on:
  workflow_dispatch:
    inputs:
      agendado:
        description: "Disparo pelo agendador"
        required: false
        default: "nao"

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Coletar assuntos em alta
        run: python3 tools/coleta_trends.py || true

      - name: Instalar dependências
        run: pip install --quiet "scrapling[fetchers]"

      - name: Coletar notícias
        run: |
          python3 tools/coleta_noticias.py 12 > coleta-noticias.json

      - name: Salvar coleta
        uses: actions/upload-artifact@v4
        with:
          name: coleta-noticias-${{ github.run_id }}
          path: |
            coleta-noticias.json
            noticias/trends.json
          retention-days: 7

      - name: Gerar edição sem Claude
        run: python3 tools/gerar_edicao.py coleta-noticias.json

      - name: Publicar edição
        run: |
          git add noticias/index.json noticias/20*.json
          if ! git diff --cached --quiet; then
            git commit -m "Notícias: edição automática sem Claude"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
