name: Gerar pauta do dia seguinte

on:
  schedule:
    - cron: "40 22 * * *"   # 19h40 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pautas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/esperar.py pauta-excluir.yml
          git pull -q --ff-only origin main || git reset -q --hard origin/main
      - name: Teste rápido do gerador
        run: |
          python3 tools/modelos_ia.py --self-test
          python3 tools/gerar_pauta.py --self-test
      - name: Coletar os assuntos em alta no X
        run: python3 tools/coleta_trends.py || true
      - name: Já existe o conteúdo de amanhã?
        id: chk
        run: |
          A=$(date -d tomorrow +%F); H=$(date +%F); G=$(python3 -c "import json;print(json.load(open('pautas/$A.json')).get('generated',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$G" == $H* ]] && [[ "${G:11:5}" > "15:00" ]]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::Conteúdo de amanhã já gerado hoje às ${G:11:5} pelo botão; mantido."; fi
      - name: Gerar pauta com IA
        id: ia
        if: steps.chk.outputs.skip != '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/gerar_pauta.py
      - name: Publicar pauta
        if: steps.chk.outputs.skip != '1'
        run: |
          ARQ="${{ steps.ia.outputs.arquivo }}"
          test -n "$ARQ" && test -f "$ARQ"
          python3 -c "import json,sys;p=json.load(open(sys.argv[1],encoding='utf-8'));assert p.get('slots') and all(len(s.get('options') or [])==2 for s in p['slots'])" "$ARQ"
          python3 tools/repeticao.py "$ARQ"
          MSG=$(python3 -c "from datetime import date; d=date.fromisoformat('${ARQ}'.split('/')[-1][:10]); print(f'Pautas de {d.day:02d}/{d.month:02d}')")
          git add "$ARQ" pautas/index.json
          if ! git diff --cached --quiet; then
            git commit -m "$MSG"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
