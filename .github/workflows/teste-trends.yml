name: Teste trends do X
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/coleta_trends.py | tee /tmp/o.txt
          echo "::notice::$(head -c 900 /tmp/o.txt)"
          python3 -c "import json;d=json.load(open('noticias/trends.json'));print(d['fonte'],len(d['trends']));[print(t) for t in d['trends'][:12]]"
