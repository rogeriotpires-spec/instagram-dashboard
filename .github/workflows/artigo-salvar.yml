name: Salvar artigo da Timeline

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Edições do artigo (JSON)"
        required: true

permissions:
  contents: write

jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - uses: actions/checkout@v4
      - name: Gravar e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/artigo_salvar.py
            python3 tools/artigo_index.py
            git add artigos/
            git diff --cached --quiet && exit 0
            git commit -qm "Artigo da Timeline salvo" && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
