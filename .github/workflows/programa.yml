name: Gerar pauta do programa

on:
  # O horário da pauta agora é gerido na página agenda.html do painel (Worker da Cloudflare, pontual).
  workflow_dispatch:
    inputs:
      agendado:
        description: "Disparo feito pelo agendador do painel (agenda.html), não pelo botão"
        required: false
        default: "nao"
      refazer:
        description: "sim = refaz os itens não avulsos e preserva só os avulsos (em destaque). nao = preserva itens já aprovados que não sejam vitrine governista nem ocorrência local"
        required: false
        default: "nao"

permissions:
  contents: write
  issues: write
  actions: write
  models: read

concurrency:
  group: programa
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/esperar.py programa-avulso.yml pauta-excluir.yml
          git pull -q --ff-only origin main || git reset -q --hard origin/main
      - name: Teste rápido do gerador
        run: |
          python3 tools/modelos_ia.py --self-test
          python3 tools/ia_comum.py --self-test
          python3 tools/gerar_programa.py --self-test
      - name: Coletar os assuntos em alta no X
        run: python3 tools/coleta_trends.py || true
      - name: Já existe pauta de hoje?
        id: chk
        run: |
          H=$(date +%F)
          # só conta como "já gerada" se a pauta tiver itens próprios; um arquivo criado apenas por itens avulsos não basta
          G=$(python3 -c "import json;p=json.load(open('programa/$H.json'));n=sum(1 for i in p.get('itens',[]) if not (i.get('avulsa') or i.get('pedido')));print(p.get('generated','') if n>=3 else '')" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$G" == $H* ]] && [[ "${G:11:5}" > "08:00" ]]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::Pauta de hoje já gerada às ${G:11:5}; nada a fazer."; fi
      - name: Gerar pauta do programa com IA
        id: ia
        if: steps.chk.outputs.skip != '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.refazer }}" = "sim" ]; then
            python3 tools/gerar_programa.py --refazer
          else
            python3 tools/gerar_programa.py
          fi
      - name: Publicar
        if: steps.chk.outputs.skip != '1'
        run: |
          ARQ="${{ steps.ia.outputs.arquivo }}"
          test -n "$ARQ" && test -f "$ARQ"
          python3 -c "import json,sys;p=json.load(open(sys.argv[1],encoding='utf-8'));assert p.get('itens') and p.get('titulo')" "$ARQ"
          python3 tools/repeticao.py "$ARQ"
          MSG=$(python3 -c "from datetime import date; d=date.fromisoformat('${ARQ}'.split('/')[-1][:10]); print(f'Pauta do programa {d.day:02d}/{d.month:02d}')")
          git add "$ARQ" programa/index.json
          if ! git diff --cached --quiet; then
            git commit -m "$MSG"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
      - name: Gerar o PDF
        if: success() && steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run programa-pdf.yml --ref main
