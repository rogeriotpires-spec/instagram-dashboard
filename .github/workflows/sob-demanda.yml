name: Gerar pauta sob demanda

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: read
  issues: write
  models: read

concurrency:
  group: sob-demanda
  cancel-in-progress: false

jobs:
  gerar:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[Virar pauta]') && github.event.issue.user.login == 'rogeriotpires-spec')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/esperar.py pauta-excluir.yml
          git pull -q --ff-only origin main || git reset -q --hard origin/main
      - name: Teste rápido do gerador
        run: |
          python3 tools/modelos_ia.py --self-test
          python3 tools/ia_comum.py --self-test
          python3 tools/gerar_sob_demanda.py --self-test
      - name: Gerar pauta sob demanda com IA
        id: ia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/gerar_sob_demanda.py --obrigatorio
      - name: Publicar
        if: steps.ia.outputs.changed == '1'
        run: |
          git add pautas/sob-demanda.json
          if ! git diff --cached --quiet; then
            git commit -m "Pautas sob demanda"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
