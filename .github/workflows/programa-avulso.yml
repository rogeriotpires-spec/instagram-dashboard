name: Item avulso na pauta do programa

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Número de uma issue [Pauta avulsa] para reprocessar (mesmo fechada). Vazio = issues abertas."
        required: false
        default: ""
        type: string
      pedido:
        description: "Texto do pedido (com a url) para usar no lugar do corpo da issue. Só vale junto com issue."
        required: false
        default: ""
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write
  models: read

concurrency:
  group: programa-avulso
  cancel-in-progress: false

jobs:
  gerar:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, '[Pauta avulsa]') && github.event.issue.user.login == 'rogeriotpires-spec')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/esperar.py programa.yml programa-avulso.yml pauta-excluir.yml
          git pull -q --ff-only origin main || git reset -q --hard origin/main
      - name: Teste rápido do gerador
        run: |
          python3 tools/modelos_ia.py --self-test
          python3 tools/ia_comum.py --self-test
          python3 tools/gerar_programa.py --self-test
          python3 tools/gerar_programa_avulso.py --self-test
      - name: Incluir item avulso com IA
        id: ia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          AVULSO_ISSUE: ${{ github.event.inputs.issue }}
          AVULSO_PEDIDO: ${{ github.event.inputs.pedido }}
        run: python3 tools/gerar_programa_avulso.py
      - name: Publicar
        if: steps.ia.outputs.changed == '1'
        run: |
          git add programa/
          if ! git diff --cached --quiet; then
            DATA="${{ steps.ia.outputs.data }}"
            MSG=$(python3 -c "from datetime import date; d=date.fromisoformat('$DATA' or date.today().isoformat()); print(f'Pauta avulsa {d.day:02d}/{d.month:02d}')")
            git commit -m "$MSG"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
      - name: Gerar o PDF
        if: success() && steps.ia.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run programa-pdf.yml --ref main
