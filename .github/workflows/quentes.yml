name: Alerta de pauta quente

on:
  schedule:
    - cron: "52 11,14,17,20 * * *"   # 08h52, 11h52, 14h52 e 17h52 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  models: read

concurrency:
  group: quentes
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Esperar a vez (outra ação mexendo no mesmo arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/esperar.py pauta-excluir.yml
          git pull -q --ff-only origin main || git reset -q --hard origin/main
      - name: Teste rápido do gerador
        run: |
          python3 tools/modelos_ia.py --self-test
          python3 tools/ia_comum.py --self-test
          python3 tools/gerar_quentes.py --self-test
          python3 tools/gerar_sob_demanda.py --self-test
      - name: Coletar os assuntos em alta no X
        run: python3 tools/coleta_trends.py || true
      - name: Gerar alertas com IA
        id: ia
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_API_AKEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/gerar_quentes.py
      - name: Publicar
        if: steps.ia.outputs.changed == '1'
        run: |
          git add pautas/quentes.json pautas/sob-demanda.json
          if ! git diff --cached --quiet; then
            if [ "${{ steps.ia.outputs.quentes }}" = "1" ] && [ "${{ steps.ia.outputs.sob }}" = "1" ]; then
              MSG="Pauta quente e pautas sob demanda"
            elif [ "${{ steps.ia.outputs.sob }}" = "1" ]; then
              MSG="Pautas sob demanda"
            else
              MSG="Pauta quente"
            fi
            git commit -m "$MSG"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                ok=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 4))
            done
            test "$ok" = 1
          fi
