name: Coleta API do Instagram

on:
  schedule:
    - cron: "20 7 * * *"   # 04:20 em Brasília: coleta completa, antes da atualização das 04:50
    - cron: "35 * * * *"   # de hora em hora: coleta rápida (seguidores por hora e stories, que somem em 24h)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-instagram
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffprobe
        if: github.event.schedule == '20 7 * * *'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Renovar token do Instagram (vale 60 dias)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          # Renova uma vez por semana (domingo)
          if [ "$(date -u +%u)" = "7" ]; then
            NEW=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
            if [ -n "$NEW" ]; then
              echo "::add-mask::$NEW"
              gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW" && echo "Token renovado."
              echo "IG_TOKEN_NEW=$NEW" >> "$GITHUB_ENV"
            else
              echo "Renovação não aplicada (o token precisa ter mais de 24h). Segue com o atual."
            fi
          fi

      - name: Coletar dados
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ -n "$IG_TOKEN_NEW" ]; then export IG_TOKEN="$IG_TOKEN_NEW"; fi
          if [ "${{ github.event.schedule }}" != "20 7 * * *" ]; then export IG_QUICK=1; fi
          python3 ig_collect.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          QUICK=0; [ "${{ github.event.schedule }}" != "20 7 * * *" ] && QUICK=1
          mkdir -p /tmp/coleta && cp raw/ig_api.json raw/durations.json /tmp/coleta/
          for i in 1 2 3 4; do
            # parte sempre da versão mais recente do site e reaplica a coleta (evita conflito com outras atualizações)
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/coleta/ig_api.json /tmp/coleta/durations.json raw/
            git add raw/ig_api.json raw/durations.json
            if [ "$QUICK" = "1" ]; then python3 build.py --quick && git add data.json history.json; MSG="Atualização rápida do painel"; else MSG="Coleta da API do Instagram"; fi
            if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
            git commit -q -m "$MSG"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          exit 1
