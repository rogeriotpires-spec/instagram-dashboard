name: Excluir item da pauta

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Item a excluir (JSON)"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: pauta-excluir
  cancel-in-progress: false

jobs:
  excluir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      PAYLOAD: ${{ inputs.payload }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Excluir e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if ! OUT=$(python3 tools/pauta_excluir.py 2>&1); then echo "::error::$OUT"; exit 1; fi
            git add programa/ pautas/
            git diff --cached --quiet && exit 0
            if git commit -qm "Item excluído da pauta" && git push -q origin HEAD:main; then
              if printf '%s' "$PAYLOAD" | grep -q '"tipo":"programa"'; then gh workflow run programa-pdf.yml --ref main || echo "::warning::não consegui pedir o PDF novo"; fi
              exit 0
            fi
            sleep $((i*3))
          done
          exit 1
