<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2e">
<meta name="apple-mobile-web-app-title" content="@rogerrio">
<title>Notícias @rogerrio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f2ee; --surface:#fcfcfb; --surface-2:#f6f5f1; --border:#e3e1da;
  --text:#0b0b0b; --text-2:#52514e; --muted:#85847e; --grid:#ebe9e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#4a3aa7; --s5:#eda100;
  --good:#0f7a4c; --good-bg:#e5f4ec; --warn:#9a5b00; --warn-bg:#fbf0dc; --bad:#b4302f; --bad-bg:#fbe6e5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111110; --surface:#1a1a19; --surface-2:#222220; --border:#2f2f2c;
    --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86; --grid:#2a2a27;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s5:#c98500;
    --good:#4cc28a; --good-bg:#16291f; --warn:#e3a43c; --warn-bg:#2d2414; --bad:#ef7b7a; --bad-bg:#311a1a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111110; --surface:#1a1a19; --surface-2:#222220; --border:#2f2f2c;
  --text:#ffffff; --text-2:#c3c2b7; --muted:#8f8e86; --grid:#2a2a27;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9; --s5:#c98500;
  --good:#4cc28a; --good-bg:#16291f; --warn:#e3a43c; --warn-bg:#2d2414; --bad:#ef7b7a; --bad-bg:#311a1a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.hero{position:relative;color:#fff;background:#0d1b2e url(capa.jpg) center 40%/cover no-repeat;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,30,.35) 0%,rgba(8,16,30,.72) 55%,rgba(8,16,30,.94) 100%);z-index:-1}
.hero-in{max-width:1180px;margin:0 auto;padding:56px 16px 28px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end}
.avatar{width:128px;height:128px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.9);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.who .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:600}
.who h1{font:700 40px/1.05 Fraunces,Georgia,serif;margin:6px 0 6px;letter-spacing:-.01em}
.who .handle{display:flex;align-items:center;gap:8px;font-size:15px;opacity:.92}
.badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#3b9cf6}
.badge svg{width:11px;height:11px}
.who .bio{font-size:14px;opacity:.78;margin-top:8px;max-width:560px}
.hero-stats{display:flex;gap:26px;text-align:right}
.hero-stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12px;opacity:.75}
.hero-meta{max-width:1180px;margin:0 auto;padding:0 16px 22px;font-size:12px;opacity:.75}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs a{white-space:nowrap;text-decoration:none;font-size:13px;font-weight:500;color:var(--text-2);padding:6px 9px;border-radius:8px}
.tabs a:hover{background:var(--surface);color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--text-2);font:500 13px Inter,sans-serif;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 56px}
section.block{margin-bottom:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.sec-h h2{font:700 24px/1.15 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
.sec-h p{margin:0;color:var(--text-2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;min-width:0}
.kpi .label{font-size:12.5px;color:var(--text-2);font-weight:600}
.kpi .val{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:12px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.card h3{font-size:15px;margin:0 0 2px;font-weight:650}
.card .desc{font-size:12.5px;color:var(--text-2);margin:0 0 10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.per{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;white-space:nowrap}
.per.diff{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.per.diff::before{content:"!";font-weight:800}
.def{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.def b{color:var(--text-2);font-weight:600}
.delta{font-size:12px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.na{color:var(--muted);font-weight:500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:2px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.legend i.dash{height:0;border-top:2px dashed var(--muted);background:none!important;vertical-align:3px;width:14px;border-radius:0}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font:11px Inter,sans-serif;fill:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;padding:8px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:50;max-width:290px;line-height:1.45}
.callout{font-size:13px;color:var(--text-2);border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.callout b{color:var(--text)}
.empty{font-size:13px;color:var(--muted);border:1px dashed var(--border);border-radius:12px;padding:18px;text-align:center}
.warnline{font-size:12px;color:var(--warn);margin-top:6px}
.pick{margin-top:10px;padding:12px;border:1px dashed var(--border);border-radius:12px;font-size:13px;color:var(--text-2)}
.pick.on{border-style:solid;background:var(--surface-2);color:var(--text)}
.btn{display:inline-block;margin-top:8px;background:var(--text);color:var(--surface);text-decoration:none;font-weight:600;padding:7px 12px;border-radius:9px;border:0;font-size:13px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.split{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0 8px}
.today{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:6px}
.fstep{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.fstep .bar{height:26px;border-radius:6px;background:var(--s1);min-width:3px}
.fstep.na .bar{background:repeating-linear-gradient(45deg,var(--grid),var(--grid) 6px,transparent 6px,transparent 12px);border:1px dashed var(--border)}
.fstep b{font-variant-numeric:tabular-nums}
.frate{font-size:12px;color:var(--text-2);padding-left:160px}
.frate b{color:var(--text)}
/* calendar */
.cal{display:grid;grid-template-columns:28px repeat(7,1fr);gap:4px;font-size:11px}
.cal .dh{color:var(--muted);text-align:center;font-weight:600}
.cal .wk{color:var(--muted);font-size:10px;display:flex;align-items:center}
.cell{min-height:44px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative}
.cell.out{opacity:.35;cursor:default}
.cell .dn{font-size:10px;color:var(--muted)}
.cell .dots{display:flex;flex-wrap:wrap;gap:2px}
.cell .dots i{width:7px;height:7px;border-radius:2px}
.cell.sel{outline:2px solid var(--text)}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.t th,.t td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
.t th.l,.t td.l{text-align:left}
.t td.w{white-space:normal;min-width:200px}
.t th{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.t.sort th{cursor:pointer;user-select:none}
.t th.on{color:var(--text)}
.t td a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.small-n{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid var(--border);color:var(--text-2);margin-right:4px;white-space:nowrap}
.tag i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
.tablewrap{overflow-x:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{font:13px Inter,sans-serif;padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.toolbar input{flex:1;min-width:160px}
.more{margin-top:12px;text-align:center}
/* analysis */
.ins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ins{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.ins-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ins h3{margin:0;font-size:16px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--text-2)}
.ins .diag{font-size:14px;color:var(--text-2);margin:0}
.ins .diag b{color:var(--text)}
.ins ol{margin:0;padding-left:20px;font-size:14px}
.ins li{margin:5px 0}
.metric-row{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.metric-row b{display:block;font-size:20px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.plan{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:13px}
.day h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2)}
.slot{border-left:3px solid var(--s1);padding:2px 0 2px 8px;margin:6px 0;line-height:1.35}
.slot small{display:block;color:var(--muted);font-size:11px}
.slot.r{border-color:var(--s2)} .slot.c{border-color:var(--s4)} .slot.s{border-color:var(--s3)}
.limits{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;font-size:13px}
.limits div{padding:8px 0;border-bottom:1px solid var(--border)}
.limits b{display:block}
.limits span{color:var(--text-2);font-size:12.5px}
.sources{font-size:12.5px;color:var(--text-2);margin-top:14px}
.sources a{text-decoration:none;border-bottom:1px dotted var(--muted)}
footer{color:var(--muted);font-size:12px;border-top:1px solid var(--border);padding-top:16px}
@media (max-width:900px){
  .hero-in{grid-template-columns:auto 1fr;padding-top:40px}
  .hero-stats{grid-column:1/-1;justify-content:flex-start;text-align:left}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .today{grid-template-columns:repeat(2,1fr)}
  .g2,.g2e,.g3,.ins-grid,.limits{grid-template-columns:1fr}
  .plan{grid-template-columns:repeat(2,1fr)}
  .fstep{grid-template-columns:110px 1fr 84px}.frate{padding-left:0}
}
@media (max-width:520px){
  .avatar{width:84px;height:84px}
  .who h1{font-size:28px}
  .hero-stats{gap:18px}.hero-stats b{font-size:20px}
  .kpi .val{font-size:22px}
  .cell{min-height:36px}
}

.seg select{border:0;background:transparent;color:var(--text);font:600 13px Inter,sans-serif;padding:5px 6px}
.seg button:disabled{opacity:.3;cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt,.hot{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hot{border-left:4px solid var(--bad);margin-bottom:12px}
.opt-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt-h h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.opt-n{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.fact{margin:0;font-size:14.5px;line-height:1.5}
.src{font-size:12.5px;color:var(--text-2)}.src a{color:var(--text-2);text-decoration:none;border-bottom:1px dotted var(--muted)}
.blk{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:6px}
.blk p,.blk ul,.blk ol{margin:0;font-size:14px;line-height:1.5}.blk ul,.blk ol{padding-left:18px}
.blk pre{margin:0;white-space:pre-wrap;font:14px/1.55 Inter,sans-serif;color:var(--text)}
.copy{border:1px solid var(--border);background:var(--surface);color:var(--text);font:600 12px Inter,sans-serif;padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.copy:hover{border-color:var(--text-2)}
.hook{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;font-size:14px;padding:6px 0;border-top:1px solid var(--border)}
.hook:first-of-type{border-top:0}.hook b{color:var(--s2)}
.note{font-size:13px;color:var(--text-2);padding:8px 10px;border-radius:10px;background:var(--warn-bg)}
.note.tl{background:var(--good-bg)}
.ag{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}.ag:last-child{border:0}
.ag a{color:var(--text-2);font-size:12.5px}
.time{display:inline-block;background:var(--text);color:var(--surface);border-radius:8px;padding:0 8px;margin-right:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.slot-sec{margin-bottom:36px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.opts{grid-template-columns:1fr}}

.segbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.segbar button{border:1px solid var(--border);background:var(--surface);color:var(--text-2);font:600 13px Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.segbar button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.segbar small{opacity:.6;font-weight:500}
.news{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.news-h{display:flex;gap:14px;align-items:flex-start}
.news h3{margin:6px 0 0;font-size:18px;line-height:1.3}
.rank{font:700 22px Fraunces,Georgia,serif;color:var(--muted);min-width:22px}
.score{font-size:28px;font-weight:800;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.sum{margin:0;font-size:15px;line-height:1.6}
.outs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.out{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 9px;text-decoration:none;color:var(--text-2)}
.out i{width:8px;height:8px;border-radius:50%}
details summary{cursor:pointer;font-size:12.5px;color:var(--text-2)}
.crits{display:grid;gap:6px;margin-top:8px}
.crit{display:grid;grid-template-columns:190px 1fr 26px;gap:10px;align-items:center;font-size:12.5px}
.crit small{color:var(--muted)}
.cbar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--s1)}
.acts{display:flex;gap:8px}
.acts .btn{margin:0}
@media (max-width:600px){.crit{grid-template-columns:1fr 26px}.crit .cbar{grid-column:1/-1;order:3}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <img class="avatar" src="rogerio.jpg" alt="Foto de Rogerio Pires">
    <div class="who">
      <div class="eyebrow">Principais notícias</div>
      <h1>Rogerio Pires</h1>
      <div class="handle">@rogerrio <span class="badge" title="Conta verificada"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></div>
      <div class="bio">As notícias que mais pesam no dia, cruzando os principais portais do país. Edições às 6h, 12h e 19h.</div>
    </div>
  </div>
  <div class="hero-meta" id="updated">Carregando…</div>
</header>

<nav>
  <div class="nav-in">
    <div class="tabs" id="segtabs"><a href="index.html">← Métricas</a><a href="pautas.html">Pautas</a></div>
    <div class="filters">
      <div class="seg"><button id="prev" aria-label="Edição anterior">‹</button><select id="ed" aria-label="Escolher edição"></select><button id="next" aria-label="Próxima edição">›</button></div>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="block">
    <div class="sec-h"><h2 id="ed-title">Notícias</h2><p id="ed-sub"></p></div>
    <div class="card" id="headline"></div>
    <div class="segbar" id="segbar"></div>
  </section>
  <section class="block" id="list"></section>
  <section class="block" id="method"></section>
  <footer>Ranking calculado a cada edição a partir dos portais listados no método. Confira as fontes antes de publicar.</footer>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const REPO="rogeriotpires-spec/instagram-dashboard";
const CAMP={direita:["Direita","var(--s1)"],"centro-direita":["Centro-direita","var(--s1)"],centro:["Centro","var(--muted)"],"centro-esquerda":["Centro-esquerda","var(--s2)"],esquerda:["Esquerda","var(--s2)"],estatal:["Estatal","var(--s4)"],internacional:["Internacional","var(--s3)"],rio:["Rio","var(--s5)"]};
const POS={manchete:"manchete",topo:"topo",secundario:"secundário","secundário":"secundário",editoria:"editoria"};
let CFG,EDS=[],CUR,ED,SEG="top",DONE={};
const label=id=>{const [y,m,d,h]=id.split("-");return`${d}/${m} ${h}`};
function seal(text,cls){return`<span class="pill ${cls}">${text}</span>`}
function scoreColor(v){return v>=8?"var(--good)":v>=6?"var(--warn)":"var(--muted)"}
function card(it,rank){
  const segL=(CFG.segments.find(s=>s.key===it.segment)||{}).label||it.segment;
  const crit=CFG.criteria.map(c=>{const v=it.scores?.[c.key];return`<div class="crit" title="${esc(c.how)}"><span>${esc(c.label)} <small>peso ${c.weight}</small></span><div class="cbar"><i style="width:${(v??0)*10}%"></i></div><b>${v??"–"}</b></div>`}).join("");
  const outs=(it.outlets||[]).map(o=>{const c=CAMP[o.camp]||[o.camp,"var(--muted)"];return`<a class="out" href="${esc(o.url)}" target="_blank" rel="noopener" title="${esc(c[0])}${o.position?" · "+esc(POS[o.position]||o.position):""}"><i style="background:${c[1]}"></i>${esc(o.name)}${o.position==="manchete"?" ★":""}</a>`}).join("");
  const done=DONE[it.title]||DONE[it.id];
  const body=`Pedido gerado pelo painel de Notícias.\n\nEdição: ${ED.id}\nItem: ${it.id}\nTítulo: ${it.title}\nBloco: ${segL}\n\nResumo:\n${it.summary}\n\nFontes:\n${(it.outlets||[]).map(o=>`- ${o.name}: ${o.url}`).join("\n")}\n\nFormato desejado (opcional, apague o que não quiser): imagem, reel, carrossel, stories\nObservação (opcional):\n`;
  const issue=`https://github.com/${REPO}/issues/new?title=${encodeURIComponent("[Virar pauta] "+it.title)}&body=${encodeURIComponent(body)}`;
  return`<article class="news">
    <div class="news-h"><span class="rank">${rank}</span><div style="flex:1;min-width:0"><div class="pills">${seal(esc(segL),"neutral")}${it.asymmetry?.flag?seal("Assimetria de cobertura","bad"):""}${done?`<a class="pill good" href="pautas.html#sob-demanda" style="text-decoration:none">Virou pauta ✓</a>`:""}</div><h3>${esc(it.title)}</h3></div><div class="score" style="color:${scoreColor(it.score)}">${(it.score??0).toFixed(1).replace(".",",")}<small>nota</small></div></div>
    <p class="sum">${esc(it.summary)}</p>
    ${it.asymmetry?.flag?`<div class="note"><b>Assimetria:</b> ${esc(it.asymmetry.note||"")}</div>`:""}
    <div class="outs"><span class="small-n">${(it.outlets||[]).length} portais:</span>${outs}</div>
    <details><summary>Como a nota foi calculada</summary><div class="crits">${crit}</div></details>
    <div class="acts">${done?`<a class="btn ghost" href="pautas.html#sob-demanda">Ver pauta</a>`:`<a class="btn" href="${issue}" target="_blank" rel="noopener">Virar pauta</a>`}</div>
  </article>`;
}
function render(){
  const items=ED.items||[];
  const segs=[{key:"top",label:"Destaques"},...CFG.segments];
  $("#segbar").innerHTML=segs.map(s=>{const n=s.key==="top"?(ED.top||[]).length:items.filter(i=>i.segment===s.key).length;return`<button class="${SEG===s.key?"on":""}" data-s="${s.key}">${esc(s.label)} <small>${n}</small></button>`}).join("");
  document.querySelectorAll("#segbar button").forEach(b=>b.onclick=()=>{SEG=b.dataset.s;render()});
  let L=SEG==="top"?(ED.top||[]).map(id=>items.find(i=>i.id===id)).filter(Boolean):items.filter(i=>i.segment===SEG).sort((a,b)=>b.score-a.score);
  $("#list").innerHTML=L.length?L.map((it,i)=>card(it,i+1)).join(""):`<div class="empty">Nenhuma notícia neste bloco nesta edição.</div>`;
}
function method(){
  const W=CFG.criteria.reduce((s,c)=>s+c.weight,0);
  $("#method").innerHTML=`<div class="sec-h"><h2>Método</h2><p>Parâmetros em noticias/config.json</p></div><div class="card">
  <p class="def" style="margin-top:0">Nota final = média ponderada dos 4 critérios (0 a 10). Resumo de ${CFG.summary_lines} linhas, até ${CFG.items_per_segment} notícias por bloco, mínimo de ${CFG.min_outlets} portais por notícia.</p>
  ${CFG.criteria.map(c=>`<div class="ag"><b>Peso ${c.weight}</b><span><b>${esc(c.label)}</b> (${Math.round(c.weight/W*100)}% da nota). ${esc(c.how)}</span></div>`).join("")}
  <div class="ag"><b>Selo</b><span><b>Assimetria de cobertura.</b> ${esc(CFG.asymmetry.rule)}</span></div>
  <p class="def">Portais monitorados (${CFG.outlets.length}): ${CFG.outlets.map(o=>`${esc(o.name)} <span class="small-n">(${esc(CAMP[o.camp]?.[0]||o.camp)})</span>`).join(", ")}. ${CFG.outlets.filter(o=>o.fetch===false).map(o=>esc(o.name)+" bloqueia leitura automática: entra só quando aparece na busca ou é citado por outro portal, e a ausência dele não pesa na nota nem na assimetria").join(". ")}${CFG.outlets.some(o=>o.fetch===false)?". ":""}A classificação por campo editorial segue a percepção corrente e pode ser ajustada no arquivo de configuração.</p></div>`;
}
async function load(id){
  CUR=id;$("#ed").value=id;const i=EDS.indexOf(id);$("#prev").disabled=i<=0;$("#next").disabled=i>=EDS.length-1;
  try{ED=await fetch(`noticias/${id}.json?`+Date.now()).then(r=>r.json());ED.id=id;
    const g=new Date(ED.generated);$("#ed-title").textContent=`Edição das ${id.slice(-3)} · ${label(id).slice(0,5)}`;
    $("#ed-sub").textContent=`Gerada em ${g.toLocaleDateString("pt-BR")} às ${g.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${(ED.items||[]).length} notícias`;
    $("#updated").textContent=$("#ed-sub").textContent;
    $("#headline").innerHTML=`<p style="font-size:16px;font-weight:600;margin:0;line-height:1.45">${esc(ED.headline||"")}</p>`;
    render();history.replaceState(null,"","#"+id)}
  catch(e){$("#list").innerHTML=`<div class="empty">Não foi possível carregar a edição ${esc(id)}.</div>`}
}
Promise.all([fetch("noticias/config.json?"+Date.now()).then(r=>r.json()),fetch("noticias/index.json?"+Date.now()).then(r=>r.ok?r.json():{editions:[]}).catch(()=>({editions:[]})),fetch("pautas/sob-demanda.json?"+Date.now()).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]}))]).then(([c,ix,sd])=>{
  CFG=c;method();(sd.items||[]).forEach(x=>{if(x.source){DONE[x.source.title]=1;DONE[x.source.item_id]=1}});
  EDS=(ix.editions||[]).sort();
  if(!EDS.length){$("#updated").textContent="A primeira edição sai no próximo horário (6h, 12h ou 19h).";$("#list").innerHTML=`<div class="empty">Nenhuma edição publicada ainda.</div>`;return}
  $("#ed").innerHTML=EDS.slice().reverse().map(e=>`<option value="${e}">${label(e)}</option>`).join("");
  $("#ed").onchange=e=>load(e.target.value);$("#prev").onclick=()=>load(EDS[EDS.indexOf(CUR)-1]);$("#next").onclick=()=>load(EDS[EDS.indexOf(CUR)+1]);
  const h=location.hash.slice(1);load(EDS.includes(h)?h:EDS[EDS.length-1]);
});
</script>
</body>
</html>
